name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Run backend tests (no ultralytics needed — reframe import is optional) ─
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install \
            fastapi==0.111.0 \
            uvicorn[standard]==0.30.1 \
            python-multipart==0.0.9 \
            groq \
            python-dotenv \
            requests==2.32.3 \
            pydantic==2.7.1 \
            aiofiles==23.2.1 \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client \
            "supabase>=2.0.0" \
            "boto3>=1.34.0" \
            pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: test_key_ci
          CLIP_USER: testuser
          CLIP_PASS: testpass

  # ── 2. Deploy to server via SSH (git pull + pip + npm build + restart) ────────
  deploy:
    name: Deploy to server
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/clipforge_new

            echo ">>> Pulling latest code..."
            git pull

            echo ">>> Installing CPU-only PyTorch first (prevents CUDA bloat)..."
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu -q

            echo ">>> Installing backend dependencies..."
            pip install -r backend/requirements.txt -q

            echo ">>> Building frontend..."
            cd frontend
            npm install --silent
            npm run build
            cd ..

            echo ">>> Restarting backend..."
            sudo systemctl restart clipforge

            echo ">>> Deploy complete!"
