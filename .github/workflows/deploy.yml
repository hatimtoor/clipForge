name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Backend tests ───────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install \
            fastapi==0.111.0 \
            uvicorn[standard]==0.30.1 \
            python-multipart==0.0.32 \
            groq \
            python-dotenv \
            requests==2.32.3 \
            pydantic==2.7.1 \
            aiofiles==23.2.1 \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client \
            "supabase>=2.0.0" \
            "boto3>=1.34.0" \
            slowapi==0.1.9 \
            pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: test_key_ci

  # ── 2. Build frontend in CI (Node 20) ─────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci --silent
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Deploy: rsync dist + git pull backend + restart ────────────────────
  deploy:
    name: Deploy to server
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend-dist"
          target: "/home/ubuntu/clipforge_new/frontend/dist"
          strip_components: 1

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/clipforge_new

            echo ">>> Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo ">>> Installing CPU-only PyTorch first (prevents CUDA bloat)..."
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu -q

            echo ">>> Installing backend dependencies..."
            pip install -r backend/requirements.txt -q

            echo ">>> Restarting backend..."
            sudo systemctl restart clipforge

            echo ">>> Deploy complete!"
