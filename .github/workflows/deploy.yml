name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Run backend tests ────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: test_key_ci
          CLIP_USER: testuser
          CLIP_PASS: testpass

  # ── 2. Build frontend in CI (Node 20) and upload dist as artifact ───────────
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Deploy to server (only if both jobs pass) ────────────────────────────
  deploy:
    name: Deploy to server
    needs: [test, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/clipforge_new

            echo ">>> Pulling latest code..."
            git pull

            echo ">>> Installing backend dependencies..."
            pip install -r backend/requirements.txt -q

            echo ">>> Restarting backend..."
            sudo systemctl restart clipforge

            echo ">>> Backend deploy complete!"

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend-dist/"
          target: "/home/ubuntu/clipforge_new/frontend/dist"
          strip_components: 1
