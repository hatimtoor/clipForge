name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Backend tests ───────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install \
            fastapi==0.111.0 \
            uvicorn[standard]==0.30.1 \
            python-multipart==0.0.9 \
            groq \
            python-dotenv \
            requests==2.32.3 \
            pydantic==2.7.1 \
            aiofiles==23.2.1 \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client \
            "supabase>=2.0.0" \
            "boto3>=1.34.0" \
            pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: test_key_ci
          CLIP_USER: testuser
          CLIP_PASS: testpass

  # ── 2. Build frontend in CI (Node 20) ─────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci --silent
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Deploy: rsync dist + git pull backend + restart ────────────────────
  deploy:
    name: Deploy to server
    needs: [test, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Rsync dist to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend-dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/clipforge_new/frontend/dist/

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/clipforge_new

            echo ">>> Pulling latest code..."
            git pull

            echo ">>> Installing CPU-only PyTorch first (prevents CUDA bloat)..."
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu -q

            echo ">>> Installing backend dependencies..."
            pip install -r backend/requirements.txt -q

            echo ">>> Restarting backend..."
            sudo systemctl restart clipforge

            echo ">>> Deploy complete!"
